[package]
name = "the_endless_corridor"
version = "0.1.0"
edition = "2021"
description = "无尽回廊 - A survival horror 2D game rebuilt in Rust Bevy"
license = "Unlicense"

[dependencies]
bevy = { version = "0.13", default-features = false, features = [
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_asset",
    "multi-threaded",
    "png",
] }
rand = "0.8"
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
